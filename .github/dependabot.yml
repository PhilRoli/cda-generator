version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      maven-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    # A major image bump is a Java version jump (and often a non-LTS one); do those
    # deliberately together with java.version in pom.xml and the CI setup-java version.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
