name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # ELGA jars aren't in the repo, so PdfGenerationInProcessTest skips itself here.
      - run: ./mvnw -B test
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun test

  # Builds the production image and starts it via compose, exactly as the server does,
  # so Dockerfile/compose/healthcheck breakage (e.g. a base-image bump) fails here
  # instead of during the deploy. Without the ELGA jars only the PDF endpoints are off.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Health check
        run: curl -fsS http://127.0.0.1:48718/api/healthz
      - name: Container logs
        if: always()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v

  deploy:
    needs: [test, image]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Set up SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf '%s\n' \
            'Host 46.225.72.0' \
            '  User deploy' \
            '  IdentityFile ~/.ssh/id_ed25519' \
            '  StrictHostKeyChecking yes' >> ~/.ssh/config
          chmod 600 ~/.ssh/config

      # Builds dist/, rsyncs to the server and runs `docker compose up -d --build` there.
      - name: Deploy
        env:
          DEPLOY_REMOTE: deploy@46.225.72.0
        run: ./deploy.sh

      # The API is briefly unavailable while the rebuilt container starts.
      - name: Smoke check
        run: |
          for i in $(seq 1 12); do
            if curl -fsS https://cda.rolinek.at/api/healthz; then
              echo
              curl -fsS https://cda.rolinek.at/api/version
              echo
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed after 60s" >&2
          exit 1
