services:
    api:
        build: .
        restart: unless-stopped
        ports:
            - '127.0.0.1:${APP_PORT:-48718}:8080'
        # Passes the optional tuning vars (APP_PDF_*, APP_BACKUP_*) from .env through;
        # the explicit entries below take precedence.
        env_file:
            - path: .env
              required: false
        environment:
            APP_DB_PATH: /app/data/cda-uebung.db
            APP_ELGA_LIB_DIR: /app/elga-lib
            APP_ELGA_STYLESHEET_PATH: /app/assets/elga-stylesheet-uebung.xsl
            APP_WATERMARK_TEXT: ${APP_WATERMARK_TEXT:-ÜBUNGSDOKUMENT}
            APP_WATERMARK_OPACITY: ${APP_WATERMARK_OPACITY:-0.17}
            APP_ADMIN_TOKEN: ${APP_ADMIN_TOKEN:-}
            APP_CLEAN_PDF_PASSWORD: ${APP_CLEAN_PDF_PASSWORD:-}
        volumes:
            - app_data:/app/data
            - ./elga-lib:/app/elga-lib:ro
        # Shared host: cap the container so a runaway PDF conversion can't starve the
        # other apps. The JVM sizes its heap to 75% of this (see entrypoint.sh).
        mem_limit: 1280m
        healthcheck:
            test: ['CMD', 'curl', '-fsS', 'http://localhost:8080/api/healthz']
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 60s
        logging:
            driver: json-file
            options:
                max-size: 10m
                max-file: '3'

volumes:
    app_data:
